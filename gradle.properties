# ---- Gradle ----
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ---- Mod ----
maven_group=dev.EfraGroup
archives_name=WolfMOD
mod_version=0.1

# Plataformas para as quais o architectury-plugin vai transformar o :common.
# O nome do modulo do Gradle tem que ser igual ao nome aqui.
enabled_platforms=fabric,neoforge,quilt,forge

# ---- Minecraft ----
minecraft_version=1.21.4

# O :common continua em mappings YARN (e nao em Mojang) para nao ter que renomear
# as 5.100 linhas ja escritas. E o plugin do Architectury que remapeia o jar do
# :common para Mojang/SRG ao gerar o jar de Forge e NeoForge.
yarn_mappings=1.21.4+build.8

# ---- Architectury ----
# 15.0.x e a linha do 1.21.4.
#
# ATENCAO: architectury-forge NAO existe para 1.21.x (o ultimo release e 11.1.17,
# que e do 1.20.6/1.21). Por isso o modulo :forge NAO depende da API do
# Architectury - ele usa so o transformer, que mora no architectury-plugin.
# Escrever o :forge contra as APIs do proprio Forge e o que mantem ele compilando.
architectury_api_version=15.0.1

# ---- Loom / plugin ----
architectury_loom_version=1.7-SNAPSHOT
architectury_plugin_version=3.4-SNAPSHOT
shadow_version=8.1.1

# ---- Loaders ----
fabric_loader_version=0.16.14
fabric_api_version=0.119.4+1.21.4
quilt_loader_version=0.28.1
# ATENCAO: o mirror do maven do Quilt nao lista build para 1.21.4 nessa
# coordenada (o maximo visivel e 1.21). Se o build do :quilt reclamar de
# resolucao, troque por uma versao 1.21.4 publicada.
quilt_fabric_api_version=9.4.0+0.119.4-1.21.4
neoforge_version=21.4.158
forge_version=1.21.4-54.1.18

# ---- Dependencias ----
# Vosk e so needed para o transcriber de voz offline (radio). Ele traz libs
# nativas, entao o empacotamento e por loader - veja o comentario em cada modulo.
vosk_version=0.3.45
