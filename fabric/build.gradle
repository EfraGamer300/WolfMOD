plugins {
    id 'com.github.johnrengelman.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Entra no jar final via shadow (o common transformed).
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // O modulo :fabric nao usa a API do Architectury ( WolfNetwork/WolfModList
    // sao facades proprias), mas ela e util para rodar o Architectury API no
    // cliente. Comente a linha se nao quiser a dependencia.
    modImplementation "dev.architectury:architectury-fabric:${rootProject.architectury_api_version}"

    // Vosk: mesma combinacao do build antigo - no classpath e bundled (JiJ).
    implementation "com.alphacephei:vosk:${rootProject.vosk_version}"
    include "com.alphacephei:vosk:${rootProject.vosk_version}"

    // Tela de configuracao: YACL desenha, Mod Menu expoe o botao. Os jars publicados
    // sao buildados com Loom 1.8/1.10 e o nosso Architectury Loom 1.7 recusa carrega-los
    // como mod dependency, entao usamos copias remapeadas para Yarn (libs/) so para
    // compilar. Em runtime o jogador instala YACL + Mod Menu originais; sem eles o mod
    // continua funcionando com a config em JSON.
    compileOnly files(rootProject.file('libs/yet-another-config-lib-3.7.1-named.jar'))
    compileOnly files(rootProject.file('libs/modmenu-13.0.4-named.jar'))

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
