// Configuracao compartilhada pelos cinco modulos.
//
// O :common e compilado em mappings YARN. O architectury-plugin le o jar
// "namedElements" do :common e gera, para cada plataforma, uma versao
// transformada (transformProduction*) com os nomes do loader alvo. E por isso que
// o mesmo codigo-fonte roda em Fabric, Quilt, NeoForge e Forge sem translation.

plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // wolfmod-fabric, wolfmod-neoforge, ...
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    loom {
        accessWidenerPath = project(':common').file('src/main/resources/wolfmod.accesswidener')

        mixin {
            defaultRefmapName = "wolfnod-refmap.json"
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"
        mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
