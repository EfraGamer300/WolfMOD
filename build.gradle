// Configuracao compartilhada pelos cinco modulos.
//
// O :common e compilado em mappings YARN. O architectury-plugin le o jar
// "namedElements" do :common e gera, para cada plataforma, uma versao
// transformada (transformProduction*) com os nomes do loader alvo. E por isso que
// o mesmo codigo-fonte roda em Fabric, Quilt, NeoForge e Forge sem translation.

plugins {
    id 'dev.architectury.loom' version "${architectury_loom_version}" apply false
    id 'architectury-plugin' version "${architectury_plugin_version}"
    id 'com.github.johnrengelman.shadow' version "${shadow_version}" apply false
}

architectury {
    minecraft = project.minecraft_version
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        // wolfmod-fabric, wolfmod-neoforge, ...
        archivesName = "${rootProject.archives_name}-${project.name}"
    }

    loom {
        accessWidenerPath = project(':common').file('src/main/resources/wolfmod.accesswidener')

        // O bloco `mixin` so pode ser configurado nos loaders que rodam em mappings
        // yarn/intermediary (fabric e quilt). NeoForge ja usa o annotation processor e
        // configurar isso la aborta com "You need to set useLegacyMixinAp = true"
        // -- mensagem enganosa: essa propriedade nao existe, o valor e derivado da
        // plataforma (isNeoForge / ForgeProvider.usesMojangAtRuntime).
        // O :common nao e loader nenhum, entao fica fora tambem.
        def loomName = loom.platform.toString().toLowerCase()
        if (loomName == 'fabric' || loomName == 'quilt') {
            mixin {
                defaultRefmapName = "wolfnod-refmap.json"
            }
        }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:${rootProject.minecraft_version}"

        // Fabric e Quilt rodam em mappings yarn. NeoForge e Forge rodam em mappings
        // Mojang, e misturar os dois quebra o remapeamento com conflitos de nome
        // ("Failed to remap minecraft"). O :common fica em yarn, que e onde o
        // codigo compartilhado esta escrito; o architectury-plugin remapeia o jar
        // do :common para Mojang/SRG ao gerar os artefatos de Forge e NeoForge.
        def platformName = loom.platform.toString().toLowerCase()
        if (platformName == 'neoforge' || platformName == 'forge') {
            mappings loom.officialMojangMappings()
        } else {
            mappings "net.fabricmc:yarn:${rootProject.yarn_mappings}:v2"
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 21
    }

    publishing {
        publications {
            mavenJava(MavenPublication) {
                artifactId = base.archivesName.get()
                from components.java
            }
        }
    }
}
