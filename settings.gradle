pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        maven { url 'https://maven.architectury.dev/' }
        maven { url 'https://maven.neoforged.net/releases' }
        maven { url 'https://maven.minecraftforge.net/' }
        maven { url 'https://maven.quiltmc.org/repository/release' }
        gradlePluginPortal()
    }
}

rootProject.name = 'WolfMOD'

// O :common e o codigo compartilhado. Os quatro modulos de loader apenas
// registram os eventos que o seu loader oferece e chamam o WolfClient.
include 'common'
include 'fabric'

// Um modulo de loader quebrado nao deve impedir a compilacao dos outros.
// Basta passar -Pskip<Modulo> para nao avaliar aquele loader.
def skip = { String name -> gradle.startParameter.projectProperties["skip$name"] != null }

if (!skip('Quilt')) {
    include 'quilt'
}
if (!skip('NeoForge')) {
    include 'neoforge'
}
if (!skip('Forge')) {
    include 'forge'
}
